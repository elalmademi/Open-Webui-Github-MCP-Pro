# =============================================================================
# .github/workflows/ci-cd.yml - CI/CD Pipeline para GitHub MCP Server Pro v2.1
# =============================================================================
# 
# FLUJO:
# 1. CI (en cada push/PR): Lint → Test Unitarios → Build Docker → Push a GHCR
# 2. CD (solo en main/tag): Deploy a servidor remoto vía SSH
#
# REQUISITOS PREVIOS EN TU SERVIDOR DESTINO:
# - Docker + Docker Compose instalados
# - Usuario SSH con permisos docker (grupo docker)
# - Carpeta del proyecto: /opt/github-mcp-pro (o la que configures)
# - Archivo .env.production en el servidor con TUS KEYS REALES
#
# SECRETS NECESARIOS EN GITHUB (Settings → Secrets → Actions):
# ──────────────────────────────────────────────────────────────────────────────
# SERVER_HOST          # IP o hostname de tu servidor (ej: 192.168.1.50 o mi-servidor.com)
# SERVER_USER          # Usuario SSH (ej: deploy, ubuntu, root)
# SERVER_SSH_KEY       # Clave privada SSH (sin passphrase) para acceso al servidor
# SERVER_PORT          # Puerto SSH (default: 22)
# PROJECT_PATH         # Ruta absoluta en servidor (ej: /opt/github-mcp-pro)
# GHCR_TOKEN           # Auto: ${{ secrets.GITHUB_TOKEN }} (para push a ghcr.io)
# ──────────────────────────────────────────────────────────────────────────────
#
# OPCIONAL (para notificaciones):
# SLACK_WEBHOOK_URL    # Webhook Slack para notificaciones
# TELEGRAM_BOT_TOKEN   # Token bot Telegram
# TELEGRAM_CHAT_ID     # Chat ID Telegram
# =============================================================================

name: CI/CD - GitHub MCP Server Pro

on:
  push:
    branches: [main, develop]
    tags: ['v*']
    paths:
      - 'mcp-github-server/**'
      - '.github/workflows/ci-cd.yml'
      - 'docker-compose.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mcp-github-server/**'
      - '.github/workflows/ci-cd.yml'
      - 'docker-compose.yml'
  workflow_dispatch:  # Permite ejecutar manualmente desde Actions tab

env:
  # Configuración global
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/github-mcp-pro
  PROJECT_DIR: mcp-github-server
  DOCKERFILE: Dockerfile
  
  # Configuración deploy (sobrescribible por secrets/vars)
  DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
  DEPLOY_USER: ${{ secrets.SERVER_USER }}
  DEPLOY_PORT: ${{ secrets.SERVER_PORT || '22' }}
  DEPLOY_PATH: ${{ secrets.PROJECT_PATH || '/opt/github-mcp-pro' }}

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 1: LINT & STATIC ANALYSIS (Rápido, falla rápido)
  # ──────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ${{ env.PROJECT_DIR }}/requirements.txt

      - name: 📦 Install lint dependencies
        run: |
          pip install --upgrade pip
          pip install ruff==0.4.4 mypy==1.10.0 bandit==1.7.8

      - name: 🔍 Ruff lint (fast Python linter)
        run: ruff check . --output-format=github

      - name: 🔍 MyPy type checking
        run: mypy main.py --ignore-missing-imports --no-error-summary

      - name: 🔒 Bandit security scan
        run: bandit -r . -f json -o bandit-report.json || true
      
      - name: 📋 Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: ${{ env.PROJECT_DIR }}/bandit-report.json
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 2: UNIT TESTS (Con coverage)
  # ──────────────────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    services:
      # Mock services para tests que necesiten Redis/GitHub API
      # redis:
      #   image: redis:7-alpine
      #   ports: 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 3
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ${{ env.PROJECT_DIR }}/requirements.txt

      - name: 📦 Install test dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.2.0 pytest-asyncio==0.23.3 pytest-cov==5.0.0 httpx==0.27.0 pytest-mock==3.14.0

      - name: 🧪 Run unit tests with coverage
        run: |
          pytest \
            -v \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=60 \
            --asyncio-mode=auto \
            tests/ || echo "No tests directory found, skipping..."
        env:
          GITHUB_TOKEN: "test_token"
          OPENROUTER_API_KEY: "test_key"
          GROQ_API_KEY: "test_key"

      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ${{ env.PROJECT_DIR }}/coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 3: BUILD DOCKER IMAGE (Multi-stage, push a GHCR)
  # ──────────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      packages: write  # Para push a ghcr.io
      attestations: write
      id-token: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🏷️ Docker meta (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=GitHub MCP Server Pro
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: 🔐 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: 🏗️ Build & Push Docker image (multi-stage target: runtime)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}
          file: ${{ env.PROJECT_DIR }}/${{ env.DOCKERFILE }}
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          platforms: linux/amd64,linux/arm64

      - name: 📝 Output image digest
        run: echo "Image pushed: ${{ steps.build.outputs.digest }}"

  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 4: INTEGRATION TEST (Contra imagen construida)
  # ──────────────────────────────────────────────────────────────────────────────
  integration-test:
    name: Integration Test (Docker)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Pull built image
        run: |
          docker pull ${{ needs.build.outputs.image-tag }}

      - name: 🚀 Start container for testing
        run: |
          docker run -d \
            --name mcp-test \
            -p 8888:8888 \
            -e GITHUB_TOKEN=test_token \
            -e OPENROUTER_API_KEY=test_key \
            -e LOG_LEVEL=DEBUG \
            ${{ needs.build.outputs.image-tag }}
          # Esperar a que esté healthy (max 30s)
          for i in {1..15}; do
            if curl -sf http://localhost:8888/health >/dev/null; then
              echo "✅ Container healthy"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Container failed to become healthy"
          docker logs mcp-test
          exit 1

      - name: 🧪 Run integration tests
        run: |
          # Test health endpoint
          curl -sf http://localhost:8888/health | jq -e '.status == "healthy"'
          
          # Test OpenAPI schema
          curl -sf http://localhost:8888/openapi.json | jq -e '.paths | length > 10'
          
          # Test tools endpoint (puede fallar sin keys reales, pero no debe 500)
          curl -sf -X POST http://localhost:8888/tools/catalogo_llm_gratis \
            -H "Content-Type: application/json" -d '{}' | jq -e '.proveedores_configurados'

      - name: 🧹 Cleanup
        if: always()
        run: docker rm -f mcp-test || true

  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 5: DEPLOY TO PRODUCTION (Solo en main/tags, requiere aprobación manual opcional)
  # ──────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [build, integration-test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: production
    # Descomenta para requerir aprobación manual antes de deploy:
    # environment: 
    #   name: production
    #   url: https://tu-dominio.com
    permissions:
      contents: read
    steps:
      - name: ⬇️ Checkout code (para docker-compose.yml)
        uses: actions/checkout@v4

      - name: 🔐 Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: 📋 Verify server connection
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ env.DEPLOY_PORT }} \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "echo '✅ SSH connection OK'; docker --version; docker compose version"

      - name: 📁 Prepare server directory
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ env.DEPLOY_PORT }} \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "mkdir -p ${{ env.DEPLOY_PATH }}/mcp-github-server ${{ env.DEPLOY_PATH }}/logs ${{ env.DEPLOY_PATH }}/local_docs"

      - name: 📤 Copy docker-compose.yml & .env.example
        run: |
          scp -o StrictHostKeyChecking=no -P ${{ env.DEPLOY_PORT }} \
            docker-compose.yml \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/
          scp -o StrictHostKeyChecking=no -P ${{ env.DEPLOY_PORT }} \
            ${{ env.PROJECT_DIR }}/.env.example \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/mcp-github-server/.env.example

      - name: 🐳 Deploy with Docker Compose (pull new image & restart)
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ env.DEPLOY_PORT }} \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} << 'EOF'
          set -e
          cd ${{ env.DEPLOY_PATH }}
          
          # Login a GHCR en el servidor (necesario si imagen es privada)
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Pull nueva imagen
          docker pull ${{ needs.build.outputs.image-tag }}
          
          # Tag como 'latest' local para docker-compose
          docker tag ${{ needs.build.outputs.image-tag }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          
          # Verificar que .env existe (si no, copiar de example y AVISAR)
          if [ ! -f .env ]; then
            echo "⚠️  .env NO EXISTE - copiando de .env.example"
            cp mcp-github-server/.env.example .env
            echo "🔴 IMPORTANTE: Edita .env con tus keys reales y re-ejecuta deploy"
          fi
          
          # Deploy con docker-compose (usa docker-compose.yml base + .env del servidor)
          docker compose up -d --remove-orphans
          
          # Verificar health
          echo "⏳ Esperando healthcheck..."
          for i in {1..30}; do
            if curl -sf http://localhost:8888/health >/dev/null; then
              echo "✅ Deploy exitoso - servicio healthy"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Deploy falló - healthcheck no pasó"
          docker compose logs --tail=50 mcp-github-server
          exit 1
          EOF

      - name: 🧹 Cleanup old images on server
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ env.DEPLOY_PORT }} \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "docker image prune -f --filter 'until=24h'"

      - name: 📢 Notify Success (Slack)
        if: always() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "✅ Deploy exitoso: ${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-tag }}",
              "blocks": [
                {"type": "section", "text": {"type": "mrkdwn", "text": "*Deploy a Producción Exitoso* ✅"}},
                {"type": "section", "fields": [
                  {"type": "mrkdwn", "text": "*Repositorio:* ${{ github.repository }}"},
                  {"type": "mrkdwn", "text": "*Branch/Tag:* ${{ github.ref_name }}"},
                  {"type": "mrkdwn", "text": "*Commit:* ${{ github.sha }}"},
                  {"type": "mrkdwn", "text": "*Imagen:* ${{ needs.build.outputs.image-tag }}"},
                  {"type": "mrkdwn", "text": "*Servidor:* ${{ env.DEPLOY_HOST }}"},
                  {"type": "mrkdwn", "text": "*Actor:* ${{ github.actor }}"}
                ]}
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: 📢 Notify Success (Telegram)
        if: always() && env.TELEGRAM_BOT_TOKEN != ''
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="✅ *Deploy Exitoso*\n📦 *${{ env.IMAGE_NAME }}*\n🏷️ `${{ needs.build.outputs.image-tag }}`\n🌿 `${{ github.ref_name }}`\n🖥️ `${{ env.DEPLOY_HOST }}`"

  # ──────────────────────────────────────────────────────────────────────────────
  # JOB 6: NOTIFY FAILURE (Si cualquier job falla)
  # ──────────────────────────────────────────────────────────────────────────────
  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [lint, test, build, integration-test, deploy]
    if: failure() && (env.SLACK_WEBHOOK_URL != '' || env.TELEGRAM_BOT_TOKEN != '')
    steps:
      - name: 📢 Notify Failure (Slack)
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "❌ Pipeline falló: ${{ github.repository }}",
              "blocks": [
                {"type": "section", "text": {"type": "mrkdwn", "text": "*Pipeline Falló* ❌"}},
                {"type": "section", "fields": [
                  {"type": "mrkdwn", "text": "*Repositorio:* ${{ github.repository }}"},
                  {"type": "mrkdwn", "text": "*Workflow:* ${{ github.workflow }}"},
                  {"type": "mrkdwn", "text": "*Branch:* ${{ github.ref_name }}"},
                  {"type": "mrkdwn", "text": "*Commit:* ${{ github.sha }}"},
                  {"type": "mrkdwn", "text": "*Actor:* ${{ github.actor }}"},
                  {"type": "mrkdwn", "text": "*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver logs>"}
                ]}
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: 📢 Notify Failure (Telegram)
        if: env.TELEGRAM_BOT_TOKEN != ''
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="❌ *Pipeline Falló*\n📦 *${{ github.repository }}*\n🌿 `${{ github.ref_name }}`\n🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver logs>"